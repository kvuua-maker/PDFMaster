name: ASC builds

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  builds:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - name: Mint API token
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID || secrets.ASK_ISSUER_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY || secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/keys"
          KEY="$RUNNER_TEMP/keys/AuthKey.p8"
          printf '%s' "$ASC_PRIVATE_KEY" | tr -d '\r' > "$KEY"
          node -e '
            const fs=require("fs"),crypto=require("crypto");
            const key=fs.readFileSync(process.env.RUNNER_TEMP+"/keys/AuthKey.p8","utf8");
            const now=Math.floor(Date.now()/1000);
            const b64=o=>Buffer.from(JSON.stringify(o)).toString("base64url");
            const data=b64({alg:"ES256",kid:process.env.ASC_KEY_ID,typ:"JWT"})+"."+b64({iss:process.env.ASC_ISSUER_ID,iat:now,exp:now+900,aud:"appstoreconnect-v1"});
            const sig=crypto.sign("sha256",Buffer.from(data),{key,dsaEncoding:"ieee-p1363"}).toString("base64url");
            fs.writeFileSync(process.env.RUNNER_TEMP+"/token.txt",data+"."+sig);
          '
          echo "ASC_TOKEN=$(cat "$RUNNER_TEMP/token.txt")" >> "$GITHUB_ENV"

      - name: List recent builds
        run: |
          set -euo pipefail
          URL="https://api.appstoreconnect.apple.com/v1/builds?filter%5Bapp%5D=6827264813&limit=4&sort=-uploadedDate&fields%5Bbuilds%5D=version,processingState,uploadedDate,expired"
          curl -s -H "Authorization: Bearer $ASC_TOKEN" "$URL" -o "$RUNNER_TEMP/builds.json"
          jq -r '.data[]? | "build \(.attributes.version) | \(.attributes.processingState) | \(.attributes.uploadedDate)"' "$RUNNER_TEMP/builds.json"
